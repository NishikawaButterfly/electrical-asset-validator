[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electrical-asset-validator"
version = "0.1.0"
description = "API for validating and comparing electrical asset registers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Electrical Asset Validator contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "reportlab>=4.2,<5",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.14",
  "pandas-stubs>=2.2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8",
  "types-openpyxl>=3.1",
  "types-reportlab>=4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "PTH", "PL", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection uses function calls (Depends, File, Form,
# Query) as parameter defaults by design; without this B008 flags every route.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# pandas, openpyxl, and reportlab publish no py.typed marker; their stub
# packages (pandas-stubs, types-openpyxl, types-reportlab) are dev
# dependencies, so no ignore_missing_imports escape hatch is needed.

[tool.coverage.run]
branch = true
source = ["electrical_asset_validator"]

[tool.coverage.report]
show_missing = true
skip_covered = true
