name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Container and PostgreSQL smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Build application images
        run: docker compose --env-file .env.example build

      - name: Start the complete stack
        run: docker compose --env-file .env.example up --detach --wait

      - name: Verify API and frontend health
        run: |
          curl --fail --show-error http://127.0.0.1:8000/api/v1/health
          curl --fail --show-error http://127.0.0.1:3000/health
          curl --fail --show-error --silent http://127.0.0.1:8000/api/v1/config \
            | grep --fixed-strings '"auth_required":false'

      - name: Verify proxied PostgreSQL write and read
        run: |
          curl --fail --show-error \
            --cookie-jar /tmp/session-cookies.txt \
            --form "file=@sample-data/revision-a.csv;type=text/csv" \
            --output /tmp/validation.json \
            http://127.0.0.1:3000/api/v1/validations
          validation_id="$(
            python -c "import json; payload=json.load(open('/tmp/validation.json')); assert payload['quality_score'] == 100; print(payload['id'])"
          )"
          curl --fail --show-error \
            --cookie /tmp/session-cookies.txt \
            --output /tmp/validation-detail.json \
            "http://127.0.0.1:3000/api/v1/validations/${validation_id}"
          python -c "import json; created=json.load(open('/tmp/validation.json')); detail=json.load(open('/tmp/validation-detail.json')); assert detail == created"
          status="$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:3000/api/v1/validations/${validation_id}"
          )"
          test "${status}" = "404"

      - name: Verify the authenticated path with two isolated tokens
        env:
          # Fictional smoke-test tokens; the comma-separated form also
          # exercises the EAV_API_TOKENS parser in a real deployment.
          EAV_API_TOKENS: smoke-alpha-token,smoke-beta-token
        run: |
          # Recreate only the backend with auth enabled; its health check
          # stays green because /health remains unauthenticated.
          docker compose --env-file .env.example up --detach --wait backend
          curl --fail --show-error --silent http://127.0.0.1:8000/api/v1/config \
            | grep --fixed-strings '"auth_required":true'
          status="$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --dump-header /tmp/unauthorized-headers.txt \
              http://127.0.0.1:8000/api/v1/validations
          )"
          test "${status}" = "401"
          grep --ignore-case '^www-authenticate: Bearer' /tmp/unauthorized-headers.txt
          status="$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer not-a-configured-token" \
              http://127.0.0.1:8000/api/v1/validations
          )"
          test "${status}" = "401"
          curl --fail --show-error \
            --header "Authorization: Bearer smoke-alpha-token" \
            --form "file=@sample-data/revision-a.csv;type=text/csv" \
            --output /tmp/token-validation.json \
            http://127.0.0.1:8000/api/v1/validations
          validation_id="$(
            python -c "import json; print(json.load(open('/tmp/token-validation.json'))['id'])"
          )"
          # The creating token reads its run back without any cookie jar.
          curl --fail --show-error \
            --header "Authorization: Bearer smoke-alpha-token" \
            --output /dev/null \
            "http://127.0.0.1:8000/api/v1/validations/${validation_id}"
          # The other configured token authenticates but sees a 404.
          status="$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer smoke-beta-token" \
              "http://127.0.0.1:8000/api/v1/validations/${validation_id}"
          )"
          test "${status}" = "404"

      - name: Stop the stack
        if: always()
        run: docker compose --env-file .env.example down --volumes

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Check backend formatting
        run: python -m ruff format --check .

      - name: Lint backend
        run: python -m ruff check .

      - name: Type-check backend
        run: python -m mypy

      - name: Run backend tests with coverage
        # The gate sits just under the measured 92.29% so real regressions
        # fail while incidental line shuffling does not. Local runs skip
        # coverage to stay fast; this is the only place the threshold lives.
        run: python -m pytest --cov=electrical_asset_validator --cov-fail-under=91

      - name: Build the backend image
        # The image compose runs, from the same context, with its base image
        # pulled fresh. Both Dockerfiles that install the backend upgrade pip
        # and run a plain `pip install .`: no dev extra and no lock file, so
        # an image holds whatever that resolves to on the day it is built.
        run: docker build --pull --tag electrical-asset-validator-backend .

      - name: Audit the backend image's Python packages
        # The list comes from the image's own interpreter, so it follows the
        # base image, not the Python this job runs. Everything there except
        # the project itself, pip included, is checked against OSV, which
        # also returns GitHub advisories that pip-audit's default PyPI
        # service can miss. Any known advisory fails the job; pip-audit has
        # no severity threshold. --strict fails on an entry it cannot check
        # instead of skipping it, which is why the project's own entry, a
        # local file URL, is left out. The interpreter is not a package: its
        # version is printed, not audited.
        run: |
          requirements="${RUNNER_TEMP}/image-requirements.txt"
          docker run --rm --entrypoint python electrical-asset-validator-backend \
            --version
          docker run --rm --entrypoint python electrical-asset-validator-backend \
            -m pip freeze --all --exclude electrical-asset-validator \
            > "${requirements}"
          cat "${requirements}"
          python -m pip_audit --requirement "${requirements}" \
            --no-deps --disable-pip --strict \
            --vulnerability-service osv --progress-spinner off

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Audit the production dependencies
        # --omit=dev leaves out the build, lint and test tooling, which the
        # images install only in their build stage. What remains is the two
        # libraries the application imports, react and react-dom, and what
        # they depend on. An advisory of any severity there fails the job,
        # as on the backend.
        run: npm audit --omit=dev --audit-level=low
