name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# bash -eo pipefail rather than the default bash -e, so that a command that
# fails inside a pipeline fails its step there, with its own error, instead of
# leaving the commands after it an empty list. A job that sets defaults of its
# own replaces these, so the backend and frontend jobs name the shell again.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Container and PostgreSQL smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Build application images
        run: docker compose --env-file .env.example build

      - name: Build the single-container image
        # The image the public demo is built from, which compose does not
        # build.
        run: docker build --tag electrical-asset-validator-demo .

      - name: Read the uv release the images use
        id: uv
        run: |
          version="$(sed -n 's|^FROM ghcr.io/astral-sh/uv:\([0-9][0-9.]*\)@sha256:[0-9a-f]\{64\} AS uv$|\1|p' backend/Dockerfile)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: false

      - name: Check that each image holds exactly the locked set
        # Three checks per image. The list the image installed from must be
        # the one this job exports from uv.lock with its own uv, hashes
        # included. pip, run inside the image with no index to fetch from,
        # must find every locked package that applies to that interpreter
        # already installed at the locked version. Then every package the
        # image holds must be in the lock at the version installed, except
        # the project itself, which must be there too.
        run: |
          exported="${RUNNER_TEMP}/requirements.txt"
          uv export --directory backend --frozen --no-default-groups --group image \
            --no-emit-project --no-header --output-file "${exported}"
          locked="${RUNNER_TEMP}/locked.txt"
          uv export --directory backend --frozen --no-default-groups --group image \
            --no-emit-project --no-hashes --no-annotate --no-header --output-file "${locked}"
          normalise() {
            awk -F '==' 'NF == 2 { name = tolower($1); gsub(/[-_.]+/, "-", name); print name "==" $2 }' \
              | sort
          }
          sed 's/ ;.*//' "${locked}" | normalise > "${RUNNER_TEMP}/locked-names.txt"
          for image in electrical-asset-validator-backend electrical-asset-validator-demo; do
            echo "::group::${image}"
            # The header names the command that wrote the list, so it is left
            # out of the comparison.
            docker run --rm --entrypoint cat "${image}" /app/requirements.txt \
              | sed '/^#/d' > "${RUNNER_TEMP}/installed-from.txt"
            if ! diff "${exported}" "${RUNNER_TEMP}/installed-from.txt"; then
              echo "${image} installed from a list that is not the export of uv.lock"
              exit 1
            fi
            docker run --rm --entrypoint python \
              --volume "${locked}:/tmp/locked.txt:ro" "${image}" \
              -m pip install --dry-run --no-deps --no-index --disable-pip-version-check \
              --requirement /tmp/locked.txt
            docker run --rm --entrypoint python "${image}" \
              -m pip list --format=freeze --disable-pip-version-check \
              | normalise > "${RUNNER_TEMP}/installed.txt"
            cat "${RUNNER_TEMP}/installed.txt"
            echo "::endgroup::"
            comm -23 "${RUNNER_TEMP}/installed.txt" "${RUNNER_TEMP}/locked-names.txt" \
              > "${RUNNER_TEMP}/not-locked.txt"
            if ! grep --quiet '^electrical-asset-validator==' "${RUNNER_TEMP}/not-locked.txt"; then
              echo "${image} does not hold the project itself"
              exit 1
            fi
            # grep exits 1 when it selects nothing, which is the pass here.
            unlocked="$(
              grep --invert-match '^electrical-asset-validator==' "${RUNNER_TEMP}/not-locked.txt" \
                || test "$?" -eq 1
            )"
            if [ -n "${unlocked}" ]; then
              echo "${image} holds packages the lock does not record:"
              echo "${unlocked}"
              exit 1
            fi
            echo "${image}: $(wc -l < "${RUNNER_TEMP}/installed.txt") packages, the locked set and the project"
          done

      - name: Smoke-test the single-container image
        run: |
          docker run --detach --name demo --publish 127.0.0.1:8001:8000 \
            electrical-asset-validator-demo
          for _ in $(seq 30); do
            curl --fail --silent --output /dev/null http://127.0.0.1:8001/api/v1/health && break
            sleep 1
          done
          curl --fail --show-error http://127.0.0.1:8001/api/v1/health
          curl --fail --show-error --silent http://127.0.0.1:8001/ \
            | grep --fixed-strings '<title>Electrical Asset Validator</title>'
          docker rm --force demo

      - name: Start the complete stack
        run: docker compose --env-file .env.example up --detach --wait

      - name: Verify API and frontend health
        run: |
          curl --fail --show-error http://127.0.0.1:8000/api/v1/health
          curl --fail --show-error http://127.0.0.1:3000/health
          curl --fail --show-error --silent http://127.0.0.1:8000/api/v1/config \
            | grep --fixed-strings '"auth_required":false'

      - name: Verify proxied PostgreSQL write and read
        run: |
          curl --fail --show-error \
            --cookie-jar /tmp/session-cookies.txt \
            --form "file=@sample-data/revision-a.csv;type=text/csv" \
            --output /tmp/validation.json \
            http://127.0.0.1:3000/api/v1/validations
          validation_id="$(
            python -c "import json; payload=json.load(open('/tmp/validation.json')); assert payload['quality_score'] == 100; print(payload['id'])"
          )"
          curl --fail --show-error \
            --cookie /tmp/session-cookies.txt \
            --output /tmp/validation-detail.json \
            "http://127.0.0.1:3000/api/v1/validations/${validation_id}"
          python -c "import json; created=json.load(open('/tmp/validation.json')); detail=json.load(open('/tmp/validation-detail.json')); assert detail == created"
          status="$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:3000/api/v1/validations/${validation_id}"
          )"
          test "${status}" = "404"

      - name: Verify the authenticated path with two isolated tokens
        env:
          # Fictional smoke-test tokens; the comma-separated form also
          # exercises the EAV_API_TOKENS parser in a real deployment.
          EAV_API_TOKENS: smoke-alpha-token,smoke-beta-token
        run: |
          # Recreate only the backend with auth enabled; its health check
          # stays green because /health remains unauthenticated.
          docker compose --env-file .env.example up --detach --wait backend
          curl --fail --show-error --silent http://127.0.0.1:8000/api/v1/config \
            | grep --fixed-strings '"auth_required":true'
          status="$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --dump-header /tmp/unauthorized-headers.txt \
              http://127.0.0.1:8000/api/v1/validations
          )"
          test "${status}" = "401"
          grep --ignore-case '^www-authenticate: Bearer' /tmp/unauthorized-headers.txt
          status="$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer not-a-configured-token" \
              http://127.0.0.1:8000/api/v1/validations
          )"
          test "${status}" = "401"
          curl --fail --show-error \
            --header "Authorization: Bearer smoke-alpha-token" \
            --form "file=@sample-data/revision-a.csv;type=text/csv" \
            --output /tmp/token-validation.json \
            http://127.0.0.1:8000/api/v1/validations
          validation_id="$(
            python -c "import json; print(json.load(open('/tmp/token-validation.json'))['id'])"
          )"
          # The creating token reads its run back without any cookie jar.
          curl --fail --show-error \
            --header "Authorization: Bearer smoke-alpha-token" \
            --output /dev/null \
            "http://127.0.0.1:8000/api/v1/validations/${validation_id}"
          # The other configured token authenticates but sees a 404.
          status="$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer smoke-beta-token" \
              "http://127.0.0.1:8000/api/v1/validations/${validation_id}"
          )"
          test "${status}" = "404"

      - name: Stop the stack
        if: always()
        run: docker compose --env-file .env.example down --volumes

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Read the uv release the images use
        id: uv
        # backend/Dockerfile names the release in its uv stage, and the root
        # Dockerfile must name the same one, so CI locks and exports with
        # exactly the uv that builds the images.
        run: |
          version="$(sed -n 's|^FROM ghcr.io/astral-sh/uv:\([0-9][0-9.]*\)@sha256:[0-9a-f]\{64\} AS uv$|\1|p' Dockerfile)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: false

      - name: Check that uv.lock matches pyproject.toml
        # Fails when a requirement in pyproject.toml has changed and the lock
        # has not been regenerated with uv lock.
        run: uv lock --check

      - name: Install backend
        # What the images install, the locked runtime set and pip, with the
        # locked build requirements and dev extra, every file checked against
        # its hash. The project goes in last, editable, built with the locked
        # setuptools and no build isolation, so pip fetches nothing for it.
        run: |
          uv export --frozen --no-default-groups --extra dev --group image --group build \
            --no-emit-project --output-file "${RUNNER_TEMP}/requirements-dev.txt"
          python -m pip install --no-deps --require-hashes --only-binary=:all: \
            --requirement "${RUNNER_TEMP}/requirements-dev.txt"
          python -m pip install --no-deps --no-build-isolation --check-build-dependencies \
            --no-index --editable .
          python -m pip check

      - name: Check backend formatting
        run: python -m ruff format --check .

      - name: Lint backend
        run: python -m ruff check .

      - name: Type-check backend
        run: python -m mypy

      - name: Run backend tests with coverage
        # The gate sits just under the measured 92.29% so real regressions
        # fail while incidental line shuffling does not. Local runs skip
        # coverage to stay fast; this is the only place the threshold lives.
        run: python -m pytest --cov=electrical_asset_validator --cov-fail-under=91

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build
