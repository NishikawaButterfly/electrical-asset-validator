name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Container and PostgreSQL smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Build application images
        run: docker compose --env-file .env.example build

      - name: Start the complete stack
        run: docker compose --env-file .env.example up --detach --wait

      - name: Verify API and frontend health
        run: |
          curl --fail --show-error http://127.0.0.1:8000/api/v1/health
          curl --fail --show-error http://127.0.0.1:3000/health

      - name: Verify proxied PostgreSQL write and read
        run: |
          curl --fail --show-error \
            --cookie-jar /tmp/session-cookies.txt \
            --form "file=@sample-data/revision-a.csv;type=text/csv" \
            --output /tmp/validation.json \
            http://127.0.0.1:3000/api/v1/validations
          validation_id="$(
            python -c "import json; payload=json.load(open('/tmp/validation.json')); assert payload['quality_score'] == 100; print(payload['id'])"
          )"
          curl --fail --show-error \
            --cookie /tmp/session-cookies.txt \
            --output /tmp/validation-detail.json \
            "http://127.0.0.1:3000/api/v1/validations/${validation_id}"
          python -c "import json; created=json.load(open('/tmp/validation.json')); detail=json.load(open('/tmp/validation-detail.json')); assert detail == created"
          status="$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:3000/api/v1/validations/${validation_id}"
          )"
          test "${status}" = "404"

      - name: Stop the stack
        if: always()
        run: docker compose --env-file .env.example down --volumes

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run backend tests
        run: python -m pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build
